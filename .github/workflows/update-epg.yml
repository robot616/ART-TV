name: Update EPG

on:
  schedule:
    - cron: '10 0 * * *'     # مرة يوميًا 00:10 GMT (2:10 ص بتوقيت القاهرة)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-epg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch EPG
        run: node fetch-epg.js
      - name: Commit epg-data.js
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add epg-data.js
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Update EPG"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push failed (attempt $i), retrying..."
            sleep 3
          done
          exit 1
