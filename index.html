<style>
:root{--ink:#0b0d12; --panel:#12151c; --panel-2:#181c25; --line:#232834; --text:#e9ecf2; --muted:#9aa2b3; --gold:#f2c35b; --green:#22c55e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink); color:var(--text); overflow:hidden; font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif}
button{font-family:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.stage{position:fixed; inset:0; background:#000}

/* زجاج */
.glass{
  background:rgba(20,24,33,.52);
  -webkit-backdrop-filter:blur(22px) saturate(150%); backdrop-filter:blur(22px) saturate(150%);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
}

/* الشاشة الرئيسية: صورة + مربع زجاجي */
#home{
  position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:30px;
  background:#0b0d12 url("https://i.postimg.cc/hvShKf9x/690n.png") center/cover no-repeat;
}
#home::before{content:""; position:absolute; inset:0; background:rgba(5,8,14,.38)}
#homeBox{position:relative; width:min(1040px, 94vw); border-radius:26px; padding:22px 22px 16px}
.home-foot{display:flex; justify-content:center; margin-top:16px}
.home-btn{display:inline-flex; align-items:center; gap:8px; padding:9px 20px; border-radius:12px; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.08); color:var(--text); font-weight:700; font-size:14px}
.home-btn:hover{background:rgba(255,255,255,.16)}

/* شارة القناة (اللوجو) */
.badge{width:84px; height:50px; flex:0 0 auto; border-radius:11px; position:relative; overflow:hidden; display:grid; place-items:center; color:#fff; font-size:20px; background:var(--ink); border:1px solid var(--c,#2a3040)}
.badge img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:6px; background:var(--ink)}

/* المشغل */
#playerWrap{position:absolute; inset:0; z-index:20; display:none; background:#000}
#playerWrap.on{display:block}
#jwplayerDiv{width:100%; height:100%}
#banner{
  direction:rtl; position:absolute; top:24px; right:24px; z-index:800; display:flex; align-items:center; gap:14px;
  background:rgba(11,13,18,.82); backdrop-filter:blur(8px); border:1px solid var(--line); border-radius:16px; padding:10px 18px 10px 14px;
  opacity:0; transform:translateY(-8px); transition:.3s; pointer-events:none;
}
#banner.show{opacity:1; transform:none}
#banner .badge{width:76px; height:44px}
#banner .t1{font-weight:800; font-size:18px}

/* ستار + نوافذ */
#scrim{position:fixed; inset:0; z-index:900; background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .25s}
#scrim.on{opacity:1; pointer-events:auto}
#menu,#epg{
  direction:rtl; position:fixed; top:50%; left:50%; z-index:1000; border-radius:22px;
  transform:translate(-50%,-46%) scale(.97); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
}
#menu.open,#epg.open{opacity:1; transform:translate(-50%,-50%); pointer-events:auto}
#menu{width:min(1000px, calc(100vw - 60px)); max-height:calc(100vh - 60px); overflow:auto; padding:20px 22px 20px}
.m-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px}
.m-head img{width:46px; height:46px; border-radius:12px; object-fit:contain; background:var(--ink); border:1px solid var(--gold); cursor:pointer}
.x-btn{width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16); color:var(--muted)}
.x-btn:hover{color:var(--text); background:rgba(255,255,255,.14)}

/* كروت القنوات */
.grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:14px; direction:rtl}
.ch{
  position:relative; display:flex; flex-direction:column; align-items:center; gap:10px; padding:16px 12px 14px; min-width:0;
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.13); border-radius:18px; transition:transform .15s, border-color .15s, background .15s;
}
.ch:hover{transform:translateY(-4px); background:rgba(255,255,255,.12)}
.ch.active{border-color:var(--green); box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.ch .badge{width:100%; height:74px; border-radius:13px; font-size:30px}
.ch-name{font-weight:700; font-size:15px}
.ch-key{position:absolute; top:10px; left:10px; z-index:2; font:700 11px/1 'Tajawal',sans-serif; color:var(--muted); background:var(--ink); border:1px solid var(--line); border-radius:6px; padding:4px 7px; direction:ltr}
.ch.active .ch-key{color:var(--green); border-color:#1d6b3b}
.live-dot{display:none; width:8px; height:8px; border-radius:50%; background:#ff4d4d; margin-inline-start:6px; animation:pulse 1.6s infinite}
.ch.active .live-dot{display:inline-block}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,77,.6)}70%{box-shadow:0 0 0 7px rgba(255,77,77,0)}100%{box-shadow:0 0 0 0 rgba(255,77,77,0)}}

/* الآن / بعده */

.n-line,.x-line{display:none; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.n-line.show,.x-line.show{display:block}
.n-line{color:var(--text)}
.n-line b{color:var(--green); font-weight:700; margin-inline-end:5px}
.x-line{color:var(--muted)}
.x-line b{font-weight:700; margin-inline-end:5px}
.bar{display:none; height:3px; border-radius:3px; background:rgba(255,255,255,.16); overflow:hidden}
.bar.show{display:block}
.bar u{display:block; height:100%; width:0; background:var(--green)}

.e-hours{position:sticky; top:0; height:36px; z-index:4; background:rgba(14,17,24,.94); border-bottom:1px solid rgba(255,255,255,.1)}
.e-corner{position:sticky; left:0; z-index:6; height:36px; background:rgba(14,17,24,.98); border-right:1px solid rgba(255,255,255,.1)}

.e-row{position:relative; height:66px; border-bottom:1px solid rgba(255,255,255,.08)}
.e-chn{position:sticky; left:0; z-index:3; width:150px; height:100%; display:flex; align-items:center; gap:8px; padding:0 10px; direction:rtl; text-align:right; background:rgba(14,17,24,.97); border:0; border-right:1px solid rgba(255,255,255,.1); color:var(--text)}

.e-chn span.nm{font-size:13px; font-weight:700; line-height:1.3}
.e-prog{

/* =============== الجدول (EPG) =============== */
const EPG_BASE = "https://www.artonline.tv";
let EPG = {};          /* { 'YYYY-MM-DD': { رقم_القناة: [[دقائق_من_منتصف_الليل_GMT, عنوان], ...] } } */
let TL  = {};          /* الجدول الموحد لكل قناة: [{s, e, title}] */
let epgStatus = '';
let lastLoadKey = '';

function utcDay(offset){ const n=new Date(); return new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()+offset)); }
const keyOfDate = d => d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());

/* لو التطبيق يوفّر window.artEpg.get / post (من برنامج الديسكتوب) نستخدمه، وإلا نجرّب الاتصال المباشر */
function fetchT(url, opt){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), 15000);
  return fetch(url, Object.assign({signal:c.signal, credentials:'omit'}, opt)).finally(()=>clearTimeout(t));
}
async function httpGet(url){
  if (window.artEpg && window.artEpg.get) return window.artEpg.get(url);
  const r = await fetchT(url, {}); return r.text();
}
async function httpPost(url, body){
  if (window.artEpg && window.artEpg.post) return window.artEpg.post(url, body);
  const r = await fetchT(url, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body}); return r.text();
}

async function getServerDays(){
  try{
    const html = await httpGet(EPG_BASE + '/guide/1');
    const out = []; const re = /<option value=['"](\d+)['"][^>]*>\s*(\d{2})\/(\d{2})\/(\d{4})/g; let m;
    while ((m = re.exec(html))) out.push({idx:+m[1], mm:m[2], dd:m[3], yyyy:m[4]});
    if (out.length) return out;
  }catch(e){}
  return [0,1,2,3,4,5].map(k=>{ const d=utcDay(k); return {idx:k, mm:pad(d.getUTCMonth()+1), dd:pad(d.getUTCDate()), yyyy:String(d.getUTCFullYear())}; });
}

function parseDay(txt){
  let j = JSON.parse(txt); if (typeof j === 'string') j = JSON.parse(j);
  const items = [];
  for (const x of (Array.isArray(j) ? j : [])){
    const m = /(\d{1,2}):(\d{2})/.exec(String(x.start_Time || ''));
    const title = String(x.title || '').trim();
    if (m && title) items.push([+m[1]*60 + +m[2], title]);
  }
  return items;
}

async function loadEpg(){
  epgStatus = 'loading'; showStatus();
  lastLoadKey = keyOfDate(utcDay(0));
  const days = await getServerDays();
  let ok = 0, fail = 0;
  for (const day of days){
    const key = day.yyyy+'-'+day.mm+'-'+day.dd, text = day.mm+'/'+day.dd+'/'+day.yyyy;
    await Promise.all(CHANNELS.map(async ch=>{
      const ask = t => httpPost(EPG_BASE + ch.epg, new URLSearchParams({objId:day.idx, objtext:t}).toString());
      try{
        let items = parseDay(await ask(text));
        if (!items.length) items = parseDay(await ask(' ' + text));
        (EPG[key] = EPG[key] || {})[ch.num] = items; ok++;
      }catch(e){ fail++; }
    }));
    rebuild();
  }
  prune(); lsSet('art_epg_v1', JSON.stringify(EPG));
  epgStatus = ok ? '' : 'error'; showStatus();
}
function prune(){
  const min = keyOfDate(utcDay(-1));
  Object.keys(EPG).forEach(k=>{ if (k < min) delete EPG[k]; });
}

function rebuild(){
  TL = {};
  const keys = Object.keys(EPG).sort();
  for (const ch of CHANNELS){
    const arr = [];
    for (const key of keys){
      const items = (EPG[key] || {})[ch.num]; if (!items) continue;
      const [y,m,d] = key.split('-').map(Number); const base = Date.UTC(y, m-1, d);
      for (const [mins, title] of items) arr.push({s: base + mins*60000, title});
    }
    arr.sort((a,b)=>a.s-b.s);
    const clean = arr.filter((p,i)=> i===0 || p.s !== arr[i-1].s);
    clean.forEach((p,i)=>{
      const nx = clean[i+1];
      let e = nx ? nx.s : p.s + 2*3600e3;
      if (e - p.s > 4*3600e3) e = p.s + 3*3600e3;      /* فجوة طويلة: نكتفي بـ 3 ساعات */
      p.e = e;
    });
    TL[ch.num] = clean;
  }
  updateNowNext();
  if (epgOpen) renderEpg(true);
}

function updateNowNext(){
  const now = Date.now();
  for (const ch of CHANNELS){
    const arr = TL[ch.num] || [];
    const cur = arr.find(p => p.s <= now && now < p.e);
    const nxt = arr.find(p => p.s > now);
    document.querySelectorAll('.ch[data-num="'+ch.num+'"]').forEach(card=>{
      const nl = card.querySelector('.n-line'), bar = card.querySelector('.bar'), xl = card.querySelector('.x-line');
      nl.classList.toggle('show', !!cur); bar.classList.toggle('show', !!cur); xl.classList.toggle('show', !!nxt);
      if (cur){
        nl.querySelector('.v').textContent = cur.title;
        bar.querySelector('u').style.width = Math.min(100, Math.max(0, (now-cur.s)/(cur.e-cur.s)*100)) + '%';
      }
      if (nxt){
        xl.querySelector('.t').textContent = fmtTime(nxt.s) + ':';
        xl.querySelector('.v').textContent = nxt.title;
      }
    });
  }
}

/* =============== لوحة EPG =============== */
const LW = 150, PPM = 200/60;
function showStatus(){
  const el = $('eStatus');
  el.textContent = epgStatus==='loading' ? 'جاري تحديث الجدول...' : epgStatus==='error' ? 'تعذّر تحديث الجدول' : '';
}
function renderEpg(keep){
  const sc = $('eScroll'); const prev = keep ? sc.scrollLeft : null;
  const n = new Date(), nowMs = n.getTime();

  /* تبويبات الأيام (بتوقيتك المحلي) */
  const fmtD = new Intl.DateTimeFormat('ar-EG-u-nu-latn', {weekday:'long'});
  $('eDays').innerHTML = [0,1,2,3,4,5].map(k=>{
    const d = new Date(n.getFullYear(), n.getMonth(), n.getDate()+k);
    const label = (k===0 ? 'اليوم' : fmtD.format(d)) + ' ' + d.getDate() + '/' + (d.getMonth()+1);
    return `<button class="day-tab ${k===epgDay?'on':''}" data-k="${k}">${label}</button>`;
  }).join('');

  const dayStart = new Date(n.getFullYear(), n.getMonth(), n.getDate()+epgDay).getTime();
  const dayEnd   = new Date(n.getFullYear(), n.getMonth(), n.getDate()+epgDay+1).getTime();
  const W = LW + (dayEnd-dayStart)/60000*PPM;

  const inner = document.createElement('div');
  inner.className = 'e-inner'; inner.style.width = W+'px';

  const hours = document.createElement('div'); hours.className = 'e-hours';
  hours.innerHTML = '<div class="e-corner" style="width:'+LW+'px"></div>';
  for (let h=0; h<24; h++){
    const t = new Date(n.getFullYear(), n.getMonth(), n.getDate()+epgDay, h).getTime();
    const el = document.createElement('div'); el.className='e-hour';
    el.style.left = (LW + (t-dayStart)/60000*PPM) + 'px'; el.textContent = fmtHour(t);
    hours.appendChild(el);
  }
  inner.appendChild(hours);

  CHANNELS.forEach((ch,i)=>{
    const row = document.createElement('div'); row.className = 'e-row';
    const cell = document.createElement('button'); cell.className = 'e-chn'; cell.dataset.i = i;
    cell.innerHTML = badgeHTML(ch) + '<span class="nm">'+ch.name+'</span>';
    row.appendChild(cell);
    let count = 0;
    for (const p of (TL[ch.num] || [])){
      if (p.e <= dayStart || p.s >= dayEnd) continue;
      const s = Math.max(p.s, dayStart), e = Math.min(p.e, dayEnd);
      const b = document.createElement('div');
      b.className = 'e-prog' + (p.s <= nowMs && nowMs < p.e ? ' now' : '');
      b.style.left = (LW + (s-dayStart)/60000*PPM) + 'px';
      b.style.width = Math.max(36, (e-s)/60000*PPM - 4) + 'px';
      b.title = fmtTime(p.s) + ' - ' + fmtTime(p.e) + '   ' + p.title;
      const pt = document.createElement('div'); pt.className='pt'; pt.textContent = fmtTime(p.s);
      const pn = document.createElement('div'); pn.className='pn'; pn.textContent = p.title;
      b.appendChild(pt); b.appendChild(pn); row.appendChild(b); count++;
    }
    if (!count){
      const em = document.createElement('div'); em.className='e-empty'; em.style.left=(LW+20)+'px';
      em.textContent = 'لا يوجد جدول لهذا اليوم'; row.appendChild(em);
    }
    inner.appendChild(row);
  });

  if (nowMs >= dayStart && nowMs < dayEnd){
    const nl = document.createElement('div'); nl.className='e-now';
    nl.style.left = (LW + (nowMs-dayStart)/60000*PPM) + 'px'; inner.appendChild(nl);
  }

  sc.innerHTML = ''; sc.appendChild(inner);
  if (prev !== null) sc.scrollLeft = prev;
  else if (epgDay === 0) sc.scrollLeft = Math.max(0, LW + (nowMs-dayStart)/60000*PPM - 300);
  else sc.scrollLeft = 0;
  showStatus();
}

/* =============== فتح وإغلاق النوافذ =============== */
function updateScrim(){ scrim.classList.toggle('on', menu.classList.contains('open') || epg.classList.contains('open')); }
function setMenu(open){
  if (open) setEpg(false, true);
  menu.classList.toggle('open', open); menu.setAttribute('aria-hidden', !open); updateScrim();
}
function setEpg(open, silent){
  if (open && !silent) setMenu(false);
  epgOpen = open; epg.classList.toggle('open', open); epg.setAttribute('aria-hidden', !open);
  if (open){ epgDay = 0; renderEpg(false); }
  updateScrim();
}
const toggleMenu = () => setMenu(!menu.classList.contains('open'));
const toggleEpg  = () => setEpg(!epg.classList.contains('open'));

/* =============== المشغل =============== */
function dock(inPlayer){
  const host = inPlayer ? $('jwplayerDiv') : null;
  if (inPlayer && !host) return;
  [scrim, menu, epg].forEach(el => (host || document.body).appendChild(el));
  (host || wrapEl).appendChild(banner);
}

/* مكان الأزرار: بين زر الجودة وزر تكبير الصورة، وزر الجدول جنب زر القنوات */
function placeButtons(){
  const root = $('jwplayerDiv');
  const ch = root.querySelector('[button="channels-button"]') || root.querySelector('[aria-label="قائمة القنوات"]');
  const ep = root.querySelector('[button="epg-button"]') || root.querySelector('[aria-label="جدول البرامج"]');
  const st = root.querySelector('[button="stretch-button"]') || root.querySelector('[aria-label="توسيع/تضييق الصورة"]');
  const se = root.querySelector('.jw-icon-settings');
  if (!ch || !st || !se) return;
  const stFirst = se.compareDocumentPosition(st) & Node.DOCUMENT_POSITION_PRECEDING;
  const later = stFirst ? se : st;
  if (later.previousElementSibling !== ch && later.previousElementSibling !== ep) later.parentNode.insertBefore(ch, later);
  if (ep && ch.nextElementSibling !== ep) ch.after(ep);
}
function addBarButtons(){
  player.addButton(CH_ICON, "قائمة القنوات", toggleMenu, "channels-button");
  player.addButton(EPG_ICON, "جدول البرامج", toggleEpg, "epg-button");
  [0, 300, 1000, 2500].forEach(t => setTimeout(placeButtons, t));
  player.on('fullscreen', () => setTimeout(placeButtons, 100));
  player.on('resize', () => setTimeout(placeButtons, 100));
}

function flashBanner(ch){
  banner.innerHTML = `${badgeHTML(ch)}<div class="t1">${ch.name}</div>`;
  banner.classList.add('show'); clearTimeout(bannerTimer);
  bannerTimer = setTimeout(()=>banner.classList.remove('show'), 3500);
}

function play(i){
  if (i<0 || i>=CHANNELS.length) return;
  const ch = CHANNELS[i]; current = i;
  renderList(); setMenu(false); setEpg(false, true);
  homeEl.style.display='none'; wrapEl.classList.add('on');
  flashBanner(ch);

  const item = { file: ch.url, drm:{ clearkey:{ keyId: ch.k1, key: ch.k2 } } };

  /* المشغل شغال: نبدّل القناة جواه (ملء الشاشة والقوائم يفضلوا زي ما هم) */
  if (player && !playerBroken){ player.load([item]); player.play(true); return; }

  playerBroken = false;
  dock(false);
  if (player){ try{player.remove()}catch(e){} player=null; }

  player = jwplayer('jwplayerDiv').setup(Object.assign({ width:'100%', height:'100%', autostart:true, stretching:'uniform' }, item));

  const fail = ()=>setMenu(true);   /* لو القناة فشلت: القائمة تظهر تاني */
  player.on('setupError', ()=>{ playerBroken = true; fail(); });
  player.on('error', fail);

  player.on('ready', function(){
    let stretched=false;
    player.addButton(STRETCH_ICON,"توسيع/تضييق الصورة",function(){
      const v=document.querySelector('#jwplayerDiv .jw-video'); stretched=!stretched;
      player.setConfig({stretching: stretched?'exactfit':'uniform'});
      if(v) v.style.objectFit = stretched?'fill':'contain';
    },"stretch-button");
    addBarButtons();
    dock(true);
  });
  player.on('audioTracks', function(){
    (player.getAudioTracks()||[]).forEach((t,idx)=>{
      const l=(t.label||'').toLowerCase();
      if (l.includes('ara')||l.includes('عرب')) player.setCurrentAudioTrack(idx);
    });
  });
}
function goHome(){
  setMenu(false); setEpg(false, true);
  dock(false);
  if (player){ try{player.remove()}catch(e){} player=null; }
  current=-1; renderList();
  wrapEl.classList.remove('on'); banner.classList.remove('show'); homeEl.style.display='flex';
}

/* =============== الأحداث =============== */
[listEl, homeGrid].forEach(el => el.addEventListener('click', e=>{ const b=e.target.closest('.ch'); if(b) play(+b.dataset.i); }));
$('closeBtn').addEventListener('click', ()=>setMenu(false));
$('epgClose').addEventListener('click', ()=>setEpg(false));
scrim.addEventListener('click', ()=>{ setMenu(false); setEpg(false); });
$('logoHome').addEventListener('click', goHome);
$('homeEpgBtn').addEventListener('click', toggleEpg);
$('eDays').addEventListener('click', e=>{ const b=e.target.closest('.day-tab'); if(b){ epgDay=+b.dataset.k; renderEpg(false); } });
$('eScroll').addEventListener('click', e=>{ const b=e.target.closest('.e-chn'); if(b) play(+b.dataset.i); });

document.addEventListener('keydown', e=>{
  if (e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key, n=CHANNELS.length;
  if (k>='1' && k<=String(n)) play(+k-1);
  else if (k==='ArrowDown'||k==='PageDown'){ e.preventDefault(); play(current<0?0:(current+1)%n); }
  else if (k==='ArrowUp'||k==='PageUp'){ e.preventDefault(); play(current<0?n-1:(current-1+n)%n); }
  else if (k==='Escape'){ setMenu(false); setEpg(false); }
  else if (k==='Tab'){ e.preventDefault(); toggleMenu(); }
  else if (k==='e'||k==='E') toggleEpg();
  else if (k==='h'||k==='H') goHome();
  else if (player && (k==='f'||k==='F')) player.setFullscreen(!player.getFullscreen());
  else if (player && (k==='m'||k==='M')) player.setMute(!player.getMute());
  else if (player && k===' '){ e.preventDefault(); player.pause(); }
});
window.addEventListener('beforeunload', ()=>{ if(player) player.remove(); });

/* =============== تشغيل =============== */
try { EPG = JSON.parse(lsGet('art_epg_v1') || '{}') || {}; } catch(e){ EPG = {}; }
renderList();
rebuild();
setTimeout(loadEpg, 800);
setInterval(()=>{
  updateNowNext();
  if (epgOpen && epgDay===0) renderEpg(true);
  if (keyOfDate(utcDay(0)) !== lastLoadKey) loadEpg();
}, 60000);
setInterval(loadEpg, 3*3600e3);
</script>
